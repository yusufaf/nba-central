<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Team Builder</title>
    <!-- Sets the theme and text size before the first paint: the app
         (useDisplayPreferences) loads too late to avoid a flash of the wrong
         theme or a jump in size. Reads this device's copy of the Display
         settings, and the OS for System or when it can't. -->
    <script>
      (function () {
        var prefs;
        try {
          prefs = JSON.parse(localStorage.getItem('nba-display-preferences'));
        } catch (e) {}
        var theme = prefs && prefs.theme;
        var scale = prefs && prefs.fontScale;
        var root = document.documentElement;
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
        if (['87.5', '112.5', '125', '137.5'].indexOf(scale) !== -1) root.style.fontSize = scale + '%';
      })();
    </script>
    <!-- Umami analytics — self-hosted, cookieless. See C:\Projects\umami-flyio. -->
    <script defer src="https://analytics.yusufaf.dev/s.js" data-website-id="e61804bb-ee89-4519-8636-beeb54e3dc7f"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

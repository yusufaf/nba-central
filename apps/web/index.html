<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Team Builder</title>
    <!-- Sets the theme before the first paint: the app (useDisplayPreferences)
         loads too late to avoid a flash of the wrong one. Reads this device's
         copy of the Theme setting, and the OS for System or when it can't. -->
    <script>
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('nba-display-preferences')).theme;
        } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <!-- Umami analytics — self-hosted, cookieless. See C:\Projects\umami-flyio. -->

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# release-please attributes each commit to whichever package's paths it touches
# (apps/web, apps/cdk). A dependency PR edits that package's package.json, so
# the commit prefixes below are deliberately chore/ci — never fix/feat — to
# keep bot PRs from bumping a version or writing a changelog entry on their
# own. Retitle a PR to `fix(deps)` by hand when a shipped dependency should
# trigger a patch release.
#
# The lambda layer manifests under apps/cdk/resources/lambda/layers are not
# listed: CDK references those layers by published ARN, so bumping their
# package-lock.json changes nothing that deploys.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"

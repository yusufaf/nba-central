name: deploy

# workflow_dispatch exists for when a push to main doesn't trigger this
# workflow - GitHub occasionally drops a push event's Actions trigger
# entirely (no run of any kind, not even ci.yml, which has no path filter -
# confirmed happened for 43ef6d15). There is no way to "re-run" a workflow
# that never ran, so the fallback is to trigger it manually for the commit
# that should have deployed.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # required for aws-actions/configure-aws-credentials OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here — declaring one changes the OIDC token's `sub`
    # claim to repo:...:environment:production instead of
    # repo:...:ref:refs/heads/main, which the deploy role's trust policy
    # doesn't match (and there's no environment protection rule configured
    # to make declaring one worth it).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here — action-setup reads the pnpm version from the
      # "packageManager" field in package.json. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # VITE_API_BASE_URL is deliberately NOT set here — leaving it unset
      # makes axios calls relative, and CloudFront's /api/* behavior routes
      # them same-origin. Setting it would break that.
      - run: pnpm --filter web build
        env:
          VITE_LOGTO_ENDPOINT: ${{ vars.VITE_LOGTO_ENDPOINT }}
          VITE_LOGTO_APP_ID: ${{ vars.VITE_LOGTO_APP_ID }}
          VITE_LOGTO_API_RESOURCE: ${{ vars.VITE_LOGTO_API_RESOURCE }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - run: aws s3 sync apps/web/dist/ s3://${{ vars.AWS_WEB_BUCKET_NAME }} --delete

      - run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_DISTRIBUTION_ID }} \
            --paths '/*'

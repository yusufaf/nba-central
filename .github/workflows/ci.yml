name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cdk: ${{ steps.filter.outputs.cdk }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            cdk:
              - 'apps/cdk/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here — action-setup reads the pnpm version from the
      # "packageManager" field in package.json. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          # Matches local dev (v24.x). Node 20 is EOL as of April 2026.
          node-version: 24
          cache: pnpm

      # --frozen-lockfile is the guard that matters: it fails if package.json
      # and pnpm-lock.yaml have drifted apart, which is exactly how a stale
      # lockfile silently reintroduced a bad `typescript` pin before.
      - run: pnpm install --frozen-lockfile

      # Cheapest gate, so it runs first. Warnings do not fail the job — the
      # remaining no-explicit-any backlog is tracked in #43.
      - run: pnpm --filter web lint

      - run: pnpm --filter web type-check

      # Guards the design system against the defects that made the UI look
      # broken: Tailwind classes that compile to nothing, invalid token alpha
      # syntax, !important, and global styling by ARIA role.
      - run: pnpm --filter web check:styles

      # Runs before build: a failing unit test should fail the job without
      # waiting on the slower Vite production build.
      - run: pnpm --filter web test

      - run: pnpm --filter web build

  cdk:
    needs: changes
    if: needs.changes.outputs.cdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same arrangement as the web job: cheapest gate first, warnings do not
      # fail the job (no-explicit-any backlog tracked in #43).
      - run: pnpm --filter cdk lint

      - run: pnpm --filter cdk build

      - run: pnpm --filter cdk test

      # Synth is the real integration check: it type-checks the stack and runs
      # esbuild over every Lambda, which is where pnpm's strict node_modules has
      # broken bundling before (see .npmrc). No AWS credentials are needed —
      # nothing in the stack does a context lookup — so dummy env values are
      # enough to construct it.
      - run: pnpm --filter cdk exec cdk synth --quiet
        env:
          account: "000000000000"
          region: us-east-1
          appName: team-builder
          deploymentType: development

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here — action-setup reads the pnpm version from the
      # "packageManager" field in package.json. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # Synth is the real integration check: it type-checks the stack and runs
      # esbuild over every Lambda, which is where pnpm's strict node_modules has
      # broken bundling before (see .npmrc). No AWS credentials are needed —
      # nothing in the stack does a context lookup — so dummy env values are
      # enough to construct it.
      - run: pnpm exec cdk synth --quiet
        env:
          account: "000000000000"
          region: us-east-1
          appName: team-builder
          deploymentType: development

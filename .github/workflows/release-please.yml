name: release-please

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # googleapis/ is where the action lives now; google-github-actions/ is the
      # old location and only redirects.
      - uses: googleapis/release-please-action@v4
        with:
          # Manifest mode. `release-type` lives in release-please-config.json
          # alongside bump-minor-pre-major, which keeps this pre-1.0 project in
          # the 0.x line: without it the first feat commit cuts 1.0.0.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

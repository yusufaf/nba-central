name: release-please

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # googleapis/ is where the action lives now; google-github-actions/ is the
      # old location and only redirects.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node

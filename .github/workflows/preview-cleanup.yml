name: PR preview cleanup

# Removes a closed PR's preview from gh-pages. No paths filter: a PR can stop
# touching apps/web after its preview was published (see preview.yml).
on:
  pull_request:
    types: [closed]

concurrency: preview-${{ github.event.number }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Most PRs never had a preview; skip them rather than comment on each.
      - id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/pr-preview/pr-${{ github.event.number }}?ref=gh-pages" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.exists == 'true'
        uses: actions/checkout@v7

      - if: steps.published.outputs.exists == 'true'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          action: remove
          pages-base-url: yusufaf.dev/${{ github.event.repository.name }}
          qr-code: false

    <!-- Default share/search tags. getPublicTeamPage (apps/cdk) swaps these
         for a published team's own on /t/:teamUUID; a tag added here needs
         handling in apps/cdk/utilities/og-html.ts too. Once the app loads,
         src/router/indexing.ts points the canonical and og:url at public
         routes and marks the rest noindex. -->
    <meta property="og:site_name" content="nba-central">
    <!-- Sets the theme and text size before the first paint: the app
         (useDisplayPreferences) loads too late to avoid a flash of the wrong
         theme or a jump in size. Reads this device's copy of the Display
         settings, and the OS for System or when it can't. -->
    <script>
      (function () {
        var prefs;
        try {
          prefs = JSON.parse(localStorage.getItem('nba-display-preferences'));
        } catch (e) {}
        var theme = prefs && prefs.theme;
        var scale = prefs && prefs.fontScale;
        var root = document.documentElement;
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
        if (['87.5', '112.5', '125', '137.5'].indexOf(scale) !== -1) root.style.fontSize = scale + '%';
      })();
    </script>
